[project]
name = "gato"
version = "0.1.0"
description = "Grid Autodiff Theory of Orbitals — differentiable, matrix-free 3D Schrödinger solver in JAX"
authors = [
    { name = "Ezequiel Garcia", email = "ezequiel@vanguardiasur.com.ar" }
]
requires-python = ">=3.14"
dependencies = [
    "equinox>=0.13.7",
    "jax>=0.10.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "optax>=0.2.8",
]

[project.scripts]
gato = "gato:main"
gato-hydrogen = "gato.physics.hydrogen:main"
gato-helium = "gato.physics.helium:main"
gato-h2plus = "gato.physics.h2_plus:main"
gato-h2 = "gato.physics.h2:main"
gato-water = "gato.physics.water:main"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with `-m \"not slow\"`)",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
