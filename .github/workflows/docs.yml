name: docs

on:
  push:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_math.js"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_math.js"

jobs:
  math:
    name: Validate LaTeX math blocks with KaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install KaTeX
        run: npm install --no-save katex@^0.16

      - name: Validate LaTeX math blocks
        # Extracts every $$...$$ and $...$ block from every tracked .md file
        # and runs it through KaTeX in strict mode (same renderer GitHub uses
        # for math in Markdown). Fails on unbalanced $$, unknown macros,
        # missing braces, and Markdown-eats-LaTeX bugs like `\phi^*` being
        # consumed by the emphasis parser.
        run: node .github/scripts/check_math.js
