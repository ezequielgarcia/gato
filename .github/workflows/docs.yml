name: docs

on:
  push:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_math.js"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_math.js"

jobs:
  markdown:
    name: Lint markdown and validate LaTeX math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install KaTeX and markdownlint
        run: npm install --no-save katex@^0.16 markdownlint-cli2@^0.15

      - name: Lint markdown
        # --no-globs because markdownlint-cli2 already globs; keep config inline
        # with a permissive ruleset (we only care about real rendering bugs).
        run: >
          npx markdownlint-cli2
          "**/*.md"
          "#node_modules/**"
          "#.venv/**"
          --config <(printf '{"default": true, "MD013": false, "MD033": false, "MD041": false, "MD034": false, "MD029": false, "MD024": false}')
        shell: bash

      - name: Validate LaTeX math blocks with KaTeX
        run: node .github/scripts/check_math.js
